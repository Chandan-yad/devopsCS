name: Nightly Housekeeper
on:
    schedule:
        - cron: '0 2 * * *'  # Runs every day at midnight UTC
    workflow_dispatch:

jobs:
    cleanup:
        runs-on: ubuntu-latest
        steps: 
            - name: Print the current date and time
              run: date

            - name: status 
              run: echo "Running nightly cleanup"

            - name: Finishes
              run: echo "Housekeeping complete"
