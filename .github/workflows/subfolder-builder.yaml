name: Subfolder Builder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Print working directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Build folder confirmed
        run: echo "Build folder confirmed"