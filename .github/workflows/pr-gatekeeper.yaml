name: PR GateKeeper
on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Print the target branch
              run:  echo "PR is being merged into ${{ github.base_ref }}"

            - name: Print the PR number
              run: echo "PR number is ${{ github.event.pull_request.number }}"
              
            - name: Complete Checks
              run: "Gatekeeper checks complete"

